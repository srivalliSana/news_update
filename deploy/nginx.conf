# Nginx reverse proxy for CUTM Campus News
# Copy to /etc/nginx/sites-available/news-update and replace YOUR_DOMAIN.
# certbot will add the HTTPS (443) block + HTTP→HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Slack posts JSON events; photos are fetched outbound by the app, not uploaded here.
    client_max_body_size 5m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
